<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel WebSeal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background-color: #faf8f5;
      color: #382c26;
      padding: 18px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #ebdcd0;
    }
    .shield-icon {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: #c86244;
      stroke-width: 2;
    }
    .title-group h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #2b1f1a;
    }
    .title-group p {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #8c7365;
      margin-top: 1px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: #edf7ed;
      color: #1e5922;
      border: 1px solid #c8e6c9;
      border-radius: 9999px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 12px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #2e7d32;
    }
    .info-card {
      background-color: #f3ede7;
      border: 1px solid #e4d8ce;
      border-radius: 12px;
      padding: 12px;
      font-size: 11px;
      line-height: 1.5;
      color: #5c4a40;
    }
    .info-card strong {
      color: #2b1f1a;
      display: block;
      margin-bottom: 4px;
    }
    .footer-note {
      margin-top: 12px;
      font-size: 10px;
      color: #9c8375;
      text-align: center;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg class="shield-icon" viewBox="0 0 24 24">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    <div class="title-group">
      <h1>Sentinel WebSeal</h1>
      <p>Payment Integrity Guard</p>
    </div>
  </div>

  <div class="status-badge">
    <span class="status-dot"></span>
    Active &amp; Monitoring
  </div>

  <div class="info-card">
    <strong>SHA-256 DOM Integrity</strong>
    Continuously hashing checkout recipient and payment state across steps to prevent silent tampering.
  </div>

  <p class="footer-note">Weave Editorial Showcase &bull; Sentinel Demo</p>
</body>
</html>
